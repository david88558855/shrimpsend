name: Build Android ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare secret stubs
        run: |
          # 离线模式不需要真实密钥，从 example 复制空模板
          cfgDir='app/lib/config'
          cp "$cfgDir/env.secrets.example.dart" "$cfgDir/env.secrets.dart"
          cp "$cfgDir/openpanel_env.secrets.example.dart" "$cfgDir/openpanel_env.secrets.dart"
          cp "$cfgDir/feedmatter_env.secrets.example.dart" "$cfgDir/feedmatter_env.secrets.dart"

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_PROPERTIES" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/release.keystore
            echo "$ANDROID_KEY_PROPERTIES" > app/android/key.properties
            echo "Signing configured from secrets."
          else
            # 无签名密钥时创建 debug 签名配置，使 CI 可正常构建
            echo "No signing secrets found — generating debug keystore for CI build."
            cd app/android
            keytool -genkey -v \
              -keystore app/debug-ci.keystore \
              -alias debug-ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=US"
            printf 'storePassword=android\nkeyPassword=android\nkeyAlias=debug-ci\nstoreFile=app/debug-ci.keystore\n' > key.properties
            cd -
          fi

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate l10n
        working-directory: app
        run: flutter gen-l10n

      - name: Build APK (direct flavor, arm64-v8a)
        working-directory: app
        run: |
          flutter build apk \
            --release \
            --flavor direct \
            --target-platform android-arm64 \
            --split-per-abi \
            --dart-define=OVERSEAS_BUILD=false

      - name: Rename APK with version
        run: |
          # 从 pubspec.yaml 读取版本号
          ver=$(grep -oP '^version:\s*\K\S+' app/pubspec.yaml || echo '0.0.0+1')
          src=$(find app/build/app/outputs/flutter-apk -name 'app-direct-arm64-v8a-release.apk' | head -1)
          if [ -z "$src" ]; then
            echo "ERROR: APK not found"
            ls -la app/build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          dst="Shrimpsend-android-cn-${ver}.apk"
          cp "$src" "$dst"
          echo "Created: $dst"

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-apk
          path: Shrimpsend-android-cn-*.apk
          retention-days: 30